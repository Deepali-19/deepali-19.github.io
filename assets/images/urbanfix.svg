    <path d="M90,100 L110,100 M100,90 L100,110" stroke="#00f5a0" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="400" y="380" fill="#f4f6fb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="24" font-weight="bold" text-anchor="middle">UrbanFix • Smart Civic Portal</text>
  <text x="400" y="410" fill="#ff6b4a" font-family="monospace" font-size="14" text-anchor="middle">GPS MAPPING &amp; MUNICIPAL DASHBOARD</text>
